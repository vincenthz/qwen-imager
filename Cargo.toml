[package]
name = "qwen-imager"
version = "0.1.0"
edition = "2024"
description = "Qwen Image 2.1 inference on Apple Metal"

[package.metadata.bundle.bin.QwenImager]
name = "QwenImager"
identifier = "app.qwen-imager.desktop"
icon = ["assets/app-icon.icns"]
category = "Photography"
short_description = "Create and edit photos locally with generative AI."
osx_minimum_system_version = "11.0"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:axum", "dep:tokio"]
gui = ["dep:gpui", "dep:gpui-component", "dep:async-channel"]

[[bin]]
name = "qwen-imager-cli"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "QwenImager"
path = "src/gui/main.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync"], optional = true }
async-channel = { version = "2", optional = true }
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders"], optional = true }
gpui-component = { version = "0.5.1", optional = true }
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
clap = { version = "4", features = ["derive"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
objc2-metal = { version = "0.3", default-features = false, features = ["MTLDevice"] }
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
